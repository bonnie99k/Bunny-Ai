<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bunny AI - Image Generator</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        width: 90%;
        max-width: 600px;
        text-align: center;
        background: rgba(255,255,255,0.05);
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h1 {
        margin-bottom: 10px;
        font-size: 28px;
    }

    p {
        font-size: 14px;
        opacity: 0.8;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 16px;
    }

    button {
        margin-top: 15px;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #6366f1;
    }

    .image-box {
        margin-top: 20px;
    }

    img {
        width: 100%;
        border-radius: 10px;
        display: none;
    }

    .loading {
        margin-top: 15px;
        display: none;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Bunny AI</h1>
    <p>Turn your words into AI-generated images</p>

    <input type="text" id="prompt" placeholder="Example: a futuristic city at night" />

    <button onclick="generateImage()">Generate Image</button>

    <div class="loading" id="loading">Generating image...</div>

    <div class="image-box">
        <img id="resultImage" />
    </div>
</div>

<script>
function generateImage() {
    const prompt = document.getElementById("prompt").value;
    const img = document.getElementById("resultImage");
    const loading = document.getElementById("loading");

    if (!prompt) {
        alert("Please enter a prompt!");
        return;
    }

    loading.style.display = "block";
    img.style.display = "none";

    const imageUrl = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);

    img.src = imageUrl;

    img.onload = () => {
        loading.style.display = "none";
        img.style.display = "block";
    };

    img.onerror = () => {
        loading.style.display = "none";
        alert("Failed to generate image. Try again.");
    };
}
</script>

</body>
</html>
