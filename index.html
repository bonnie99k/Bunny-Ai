<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Nexus - Smart AI Tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: white;
}

header {
  padding: 18px;
  background: #111827;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 20px;
  font-weight: bold;
  color: #38bdf8;
}

.container {
  display: grid;
  grid-template-columns: 250px 1fr;
  height: calc(100vh - 60px);
}

.sidebar {
  background: #0f172a;
  padding: 15px;
}

.sidebar button {
  width: 100%;
  margin-bottom: 10px;
  padding: 10px;
  background: #1e293b;
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.sidebar button:hover {
  background: #38bdf8;
}

.main {
  padding: 20px;
}

.card {
  background: #111827;
  padding: 15px;
  border-radius: 10px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}

.btn {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  background: #38bdf8;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.output {
  margin-top: 10px;
  padding: 10px;
  background: #0b1220;
  border-radius: 6px;
}

@media (max-width: 768px) {
  .container { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <div class="logo">🤖 AI NEXUS</div>
  <div>Pro AI Tools Platform</div>
</header>

<div class="container">

<div class="sidebar">
  <button onclick="openTool('chat')">AI Chat</button>
  <button onclick="openTool('writer')">AI Writer</button>
  <button onclick="openTool('ideas')">Idea Generator</button>
</div>

<div class="main">

<div id="chat" class="card tool">
  <h2>AI Chat</h2>
  <input id="chatInput" placeholder="Ask anything...">
  <button class="btn" onclick="chat()">Send</button>
  <div class="output" id="chatOut"></div>
</div>

<div id="writer" class="card tool" style="display:none;">
  <h2>AI Writer</h2>
  <textarea id="writeInput" rows="5"></textarea>
  <button class="btn" onclick="writeAI()">Generate</button>
  <div class="output" id="writeOut"></div>
</div>

<div id="ideas" class="card tool" style="display:none;">
  <h2>Idea Generator</h2>
  <input id="ideaInput" placeholder="Niche">
  <button class="btn" onclick="ideas()">Generate</button>
  <div class="output" id="ideaOut"></div>
</div>

</div>
</div>

<script>
function openTool(id){
  document.querySelectorAll('.tool').forEach(t => t.style.display='none');
  document.getElementById(id).style.display='block';
}

function chat(){
  let msg = document.getElementById("chatInput").value;
  document.getElementById("chatOut").innerText =
  "AI: " + msg + " (demo response)";
}

function writeAI(){
  let topic = document.getElementById("writeInput").value;
  document.getElementById("writeOut").innerText =
  "Generated article about " + topic;
}

function ideas(){
  let niche = document.getElementById("ideaInput").value;
  document.getElementById("ideaOut").innerText =
  "Ideas: " + niche + " website, app, tool, bot, channel";
}
</script>

</body>
</html>
